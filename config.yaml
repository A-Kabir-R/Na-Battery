      #             rate_data: 0.005, pairwise: 0.0, residual_share: 0.01}
      # A10: hybrid model, no residual-share penalty. Lets the neural residual
      # grow without constraint, turning the model back toward a black box.
      # - name: "A10_No_Residual_Share_Penalty"
      #   architecture: "NaPINN-Q"

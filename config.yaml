      #             rate_data: 0.005, pairwise: 0.0, residual_share: 0.01}
      # A12 (full hybrid model, all components active) is commented out of the
      # sweep as of 2026-08-05: this IS the main/headline model -- pinn.model
      # above (use_hybrid_rate: true, rate_floor: 0.0) already trains exactly
      # this configuration via the primary `pinn` stage, so including it here
      # too just retrains a duplicate inside a multi-config sequential sweep,
      # where cross-run GPU/PyTorch non-determinism (confirmed empirically:
      # isolated single-config run vs. inside-the-sweep run of the identical
      # config differed by ~0.03 R2 on the delta targets, even single-process
      # with no other GPU users) makes its ablation-table number a noisier,
      # less trustworthy copy of the real headline result. Report the
      # headline model's numbers from its own dedicated `pinn` stage run, not
      # from this ablation table. A9-A11 (which each ablate one hybrid
      # sub-component away from this same config) are unaffected and stay
      # enabled below -- they are genuine ablations, not a duplicate of the
      # headline.
      # - name: "A12_Full_Hybrid_NaPINN_Q"
      #   architecture: "NaPINN-Q"
      #   model_overrides: {use_hybrid_rate: true, rate_floor: 0.0}

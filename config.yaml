                  rate_data: 0.005, pairwise: 0.02}
      # ---- A8–A13: hybrid-rate component ablations (require use_hybrid_rate) -
      # A8: replace HybridRateModel with generic RateNet (hard IC + all physics
      # losses active). Equals A5 (same rate_floor=0.06 override); serves as
      # the cross-reference baseline for the A9-A11 hybrid comparisons (A12,
      # the full hybrid config, is the headline model -- see its comment below).
      - name: "A8_Generic_Rate_Baseline"
        architecture: "NaPINN-Q"
        model_overrides: {use_hybrid_rate: false, rate_floor: 0.06}
        weights: {data: 1.0, ode: 0.001, initial_condition: 0.1, integral: 0.005,
                  monotonicity: 0.002, bounds: 0.05, rate_regularization: 1.0e-4,
                  rate_data: 0.005, pairwise: 0.0, residual_share: 0.0}
      # A9: hybrid model, cold-regime term disabled. Isolates the low-temperature

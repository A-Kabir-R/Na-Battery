paths:
  # Any value may be overridden via env vars. Precedence:
  #   ${env:VAR:-default}  ->  os.environ["VAR"] if set, else "default"
  # This lets the same config work on the laptop and on RunPod.
  root:         "${env:SIB_ROOT:-/media/kabir/Research/Project/sodium battery /Data_Failure_Mode_and_Degradation_Analysis_of_a_Commercial_Sodium-Ion_Battery_With_Severe_Gassing_Issue/Standard cycling}"
  data_statics: "${env:SIB_DATA_STATICS:-${paths.root}/code/data_statics}"
  # DOD*/CU_at_25degC/*.ird and DOD*/Cycling_Periods/*.ird live under this root.
  # On laptop it's the same as `paths.root`; on the pod it points at the extracted dataset dir.
  dataset_root: "${env:SIB_DATASET_ROOT:-${paths.root}}"
  tables:
    cycle_metrics:      "${paths.data_statics}/tables/cycle_metrics.csv"
    file_statistics:    "${paths.data_statics}/tables/file_statistics.csv"
    inventory:          "${paths.data_statics}/tables/inventory.csv"
    degradation_rates:  "${paths.data_statics}/tables/degradation_rates.csv"
    condition_summary:  "${paths.data_statics}/tables/condition_summary.csv"
  parse_errors_csv:     "${paths.data_statics}/logs/parse_errors.csv"
  artifacts:            "${env:SIB_ARTIFACTS:-${paths.root}/code/artifacts}"
  canonical:            "${env:SIB_CANONICAL:-${paths.artifacts}/canonical}"
  logs:                 "${env:SIB_LOGS:-${paths.root}/code/logs}"

cleaning:
  hampel_window: 5
  hampel_k: 3.0
  incomplete_cycle_frac: 0.5      # drop cycle if Q < 0.5 * cell median
  ce_clip: [0.4, 1.05]
  soh_clip_max: 100.0             # clip target SOH to <= 100 (activation handling)
  skip_files:
    - "S2000FP452_CU_at-10degC_V01_4860.ird"
    - "S2000FQ9MI_CU_at50degC_V01_4872.ird"

protocol:
  # Inferred from raw Standard-cycling protocols; confirm against RWTH metadata.
  nominal_capacity_Ah: 1.2
  current_deadband_A: 0.02
  cycling_current_relative_tolerance: 0.35
  minimum_phase_capacity_Ah: 0.001
  capacity_ratio_bounds: [0.25, 4.0]
  # Reject narrow diagnostic pulse pairs as complete cycling cycles without
  # deleting genuinely degraded cycles that still traverse the voltage window.
  minimum_cycle_voltage_span_V: 0.30
  minimum_phase_voltage_span_V: 0.25
  max_invalid_fraction: 0.0
  max_sampling_gap_s: 300.0
  physical_bounds:
    Voltage: [0.0, 5.0]
    Current: [-5.0, 5.0]
    Temperature: [-30.0, 70.0]
  rpt_reference_current_A: 0.6
  rpt_current_relative_tolerance: 0.2
  rpt_charged_voltage_min_V: 3.6
  rpt_discharged_voltage_max_V: 1.8
  rpt_capacity_bounds_Ah: [0.2, 2.0]

preprocessing:
  rolling_window: 10
  severson_window: [10, 100]
  dqdv_smooth_sigma: 3
  vq_resample_points: 100
  minimum_p3_file_coverage: 0.95
  minimum_p3_cycle_coverage: 0.98
  # ---- unified preprocessing: the only level used for final training ----
  # Voltage-grid resolution for true Delta-Q(V). The grid spans only the shared
  # voltage interval of the two curves being differenced; no extrapolation.
  dqv_grid_points: 100
  # Trailing complete cycles for the Group C temporal summaries.
  unified_temporal_window: 10
  # Minimum valid observations inside that window before a temporal feature is
  # emitted; below this the features are NaN and temporal_window_available = 0.
  unified_minimum_temporal_observations: 5
  # Minimum fraction of anchors that must receive waveform features before the
  # unified build is accepted.
  unified_minimum_waveform_coverage: 0.95

targets:
  next_rpt:
    initial_visit: 0
    delta_sign: "next_minus_previous"
  capacity_eol:
    soh_threshold_pct: 80.0
    minimum_consecutive_cycles: 3
  failure:
    enabled: false
    events_path: null

split:
  holdout_fraction: 0.25
  n_splits: 5
  random_state: 42
  stratify_by: "condition"
  holdout_candidates: 1024

evaluation:
  bootstrap_replicates: 100
  bootstrap_random_state: 42
  horizon_bin_edges_days: [0.0, 1.0, 5.0, 15.0, 1000000.0]
  horizon_bin_labels: ["<1d", "1-5d", "5-15d", ">15d"]
  prediction_bounds:
    next_rpt_Q_Ah: [0.0, 2.0]
    next_rpt_SOH_pct: [0.0, 150.0]
    delta_next_rpt_Q_Ah: [-1.0, 1.0]
    delta_next_rpt_SOH_pct: [-100.0, 100.0]

plotting:
  # Vector first: journals require vector artwork for line figures, and the
  # raster copy is the convenience preview. Both are written for every figure.
  formats: ["pdf", "png"]
  dpi: 300

experiment:
  parallel_workers: 6
  cache_features: true
  # Isolate this run's aggregated tables/plots from historical outputs written
  # under artifacts/results/. Set to "" or null to write directly to the base
  # artifacts/results/ directory. The subdir is created lazily.
  results_subdir: "unified_final_comparison"
  # Prevent nested parallelism: when parallel_workers > 1, models that expose
  # n_jobs (ExtraTrees, RandomForest, XGBoost, ...) are forced to this value
  # so that thread counts do not multiply across the outer joblib pool.
  model_n_jobs: 1
  # The single preprocessing level used by every retained model. P1/P2/P3 remain
  # in the codebase for traceability but are not run in the final experiment.
  preprocessing_levels:
    - unified
  # Locked-holdout gate. Keep FALSE for all development work: with it false the
  # classical runner evaluates cross-validation folds only and never touches the
  # holdout partition. Set true exactly once, after preprocessing, architecture,
  # losses and every other setting are frozen (execution-order step 22).
  #
  # NOTE ON PROVENANCE: holdout metrics for P1/P2/P3 were already computed during
  # the earlier "extratrees_preprocessing_selection" run, so the holdout is not
  # pristine for the classical arm. The final report must state that the
  # classical holdout is a second look, and a first look only for the unified /
  # NaPINN-Q arm. See docs/UNIFIED_PREPROCESSING.md.
  evaluate_holdout: false

# Central regressor allowlist. Only names listed here are executed by
# scripts/02_run_all_experiments.py; every other regressor implementation
# remains in src/models/regressors.py for later experiments. The order is
# preserved for reproducibility of the startup banner and the raw results.
#
# PRESPECIFIED MODEL SET (4 ML models + 2 reference baselines).
# Selected on the development set under cell-grouped 5-fold CV on the delta
# target, one representative per model family. Measured pooled / cell-macro MAE
# in Ah, averaged over 5 cell-shuffle repeats:
#     ExtraTrees        0.00286 / 0.00523   (best overall)
#     GradientBoosting  0.00326 / 0.00611   (boosted-tree family)
#     Ridge             0.00350 / 0.00596   (linear, interpretable)
#     MLP               0.00330 / 0.00659   (unconstrained neural reference)
#     PreviousRPT       0.00871 / 0.01602   (persistence; the reference to beat)
# A paired cell-clustered bootstrap (4000 reps) shows ExtraTrees, Ridge and MLP
# are STATISTICALLY INDISTINGUISHABLE (CIs cross zero); only the gap to
# PreviousRPT survives clustering. Report them as a tie, not a leaderboard.
#
# Removed and why:
#   SVR-RBF, SVR-linear, KNN  - clearly worse (0.00385-0.00463 pooled).
#   RandomForest              - redundant with ExtraTrees (same family).
#   DecisionTree, Lasso       - dominated by their regularised/ensembled forms.
#   ElasticNet                - statistical tie with Ridge; keep one linear model.
#   XGBoost, LightGBM, CatBoost - NOT INSTALLED in the current environment, so
#       they silently drop out of the matrix via optional imports. GradientBoosting
#       is the installed boosted-tree representative. Re-add exactly one of these
#       only if it is added to the dependency lock.
#   DummyMedian               - DummyMean alone is the variance reference.
# MLP is retained because a PINN paper must show the physics-constrained model
# against an unconstrained network of comparable capacity (ablation A0).
models:
  enabled_regressors:
    # Reference baselines (not part of the 4-model comparison)
    - DummyMean
    - PreviousRPT

    # Linear
    - Ridge

    # Tree ensembles
    - ExtraTrees
    - GradientBoosting

    # Unconstrained neural reference
    - MLP

# ---------------------------------------------------------------------------
# NaPINN-Q autograd-based physics-informed neural network configuration.
# Consumed by scripts/06_run_pinn_experiments.py and downstream aggregation.
# The classical pipeline above is not modified when pinn.enabled is toggled.
# ---------------------------------------------------------------------------
pinn:
  enabled: true
  model_name: "NaPINN-Q"
  results_subdir: "pinn_unified_study"

  # One unified preprocessing for every retained model. P1/P2/P3 are no longer
  # run as experimental alternatives.
  preprocessing:
    - unified

  architectures:
    - NaPINN-Q

  # Seed 42 is the pre-registered primary result and the only one used for any
  # tuning decision. The remaining seeds are reported ONLY as a robustness note
  # ("spread across random initializations"), never as a seed-averaged headline
  # metric and never as a selection criterion. With ~140 training rows the
  # initialization spread can be comparable to the Ridge-vs-PINN gap, so hiding
  # it would overstate the result.
  primary_seed: 42
  seeds:
    - 42
    - 43
    - 44
    - 45
    - 46

  derive_all_targets_from_capacity: true
  reuse_existing_folds: true
  reuse_existing_holdout: true

  stress:
    preferred_coordinate: "EFC_cum"
    fallback_coordinate: "cumulative_Ah_throughput"
    allow_elapsed_time_fallback: true
    time_fallback_column: "cycle_end_time_s"
    # Retrospective block-to-RPT task: Δs is exposure accumulated during the
    # current (already completed) CYC block, so the horizon is always known.
    require_known_forecast_horizon: true
    epsilon: 1.0e-6

  audit:
    # If false, any feature column not on the causal allow-list (or matching a
    # known-causal name prefix) is rejected at dataset-build time with an
    # explicit reason. Set true only when you have manually vetted the
    # preprocessing pipeline for temporal safety.
    allow_unaudited: false
    # Fixed seed for the inner (early-stopping) split; must NOT be the training
    # seed so that seed variability isolates neural stochasticity rather than
    # also changing the inner-validation cell composition.
    inner_split_seed: 20240117

  model:
    # Compact heads for the ~175-anchor development set (~140 training rows per
    # outer fold). With the 38-column unified auxiliary tensor the solution head
    # is ~1.0k parameters; going wider is not supportable at this sample size.
    solution_hidden_dims: [16, 16]
    rate_hidden_dims: [8, 8]
    solution_activation: "tanh"
    rate_activation: "tanh"
    rate_output_activation: "softplus"
    # Dropout is wired through TrainerConfig -> NaPINNQ and is active at runtime.
    solution_dropout: 0.15
    rate_dropout: 0.05
    # When true, the rate network receives u_hat as an input. Setting false
    # produces the constrained-rate variant used in ablation A6, which
    # prevents H = du/ds + r ≈ 0 from being satisfied tautologically
    # (Stage 2 diagnosis fix #14).
    rate_uses_u_hat: false
    # Hard initial-condition residual parameterisation:
    #     u_hat(s) = u_current + (s - s_current) * f_theta(s, x)
    # so u_hat(s_current) == u_current exactly, for any parameters. The final
    # layer of f_theta is zero-initialised, so an untrained model predicts
    # persistence. (Previously this flag produced u_current + f_theta(s, x),
    # which does NOT satisfy the initial condition; it was merely penalised.)
    predict_delta_u: true
    maximum_parameters: 50000
    # ---------------------------------------------------------------------------
    # Hybrid rate model (opt-in). When use_hybrid_rate is true, NaPINNQ
    # replaces the generic RateNet with HybridRateModel, which decomposes the
    # degradation rate into named physical components:
    #
    #   r_total = r_cycling + r_cold + r_calendar + r_diagnostic + r_residual
    #
    # r_cycling is an Arrhenius × DOD power law; r_cold is a sigmoidal
    # low-temperature term; r_residual is a neural correction penalised toward
    # zero (weight = losses.residual_share). The two stress-condition features
    # (T_degC, DOD_pct) must be present in the unified feature registry.
    #
    # NOTE: DOD20 and DOD80 are both tested at 2C only, so DOD and C-rate
    # exponents are confounded (condition number ~1.3e4). The C-rate exponent
    # is frozen at zero (hybrid_fit_c_rate_exponent: false) following Klick et
    # al. (Batteries & Supercaps 2025), who report no significant C-rate effect.
    # Set hybrid_fit_c_rate_exponent: true to test that published finding.
    # ---------------------------------------------------------------------------
    use_hybrid_rate: false          # set true to activate
    hybrid_temperature_feature: "T_degC"
    hybrid_dod_feature: "DOD_pct"
    hybrid_c_rate_feature: ""       # empty → DOD column reused; exponent frozen 0
    hybrid_enable_cold_regime: true
    hybrid_fit_c_rate_exponent: false
    hybrid_residual_share_limit: 0.5

  collocation:
    enabled: true
    points_per_transition: 8
    sampling: "uniform"
    resample_each_epoch: true

  quadrature:
    method: "trapezoidal"       # midpoint | trapezoidal
    nodes: 8

  training:
    optimizer: "adamw"
    learning_rate: 0.001
    # Stage-3 fix #2: 100× stronger L2 regularization to counter the
    # ~120-sample overfitting regime.
    weight_decay: 0.001
    # Budget sized so the curriculum reaches full physics (epoch 100 with
    # ramp_end_fraction=0.20) well before minimum_epochs, and so early stopping
    # can only fire after many fully-physics-active epochs.
    maximum_epochs: 500
    minimum_epochs: 180
    early_stopping_patience: 80
    scheduler: "reduce_on_plateau"
    scheduler_factor: 0.5
    scheduler_patience: 30
    minimum_learning_rate: 1.0e-6
    gradient_clip_norm: 1.0
    # Cell-balanced mini-batching (see src/pinn/batching.py). batch_mode is
    # honoured at runtime; the forward pass is restricted to the sampled rows.
    batch_size: 32
    # AMP is not implemented — mixed precision breaks the fp32 autograd path
    # used for du/ds and the PDE residual. Keep this false until an
    # autocast/GradScaler wrapper that preserves fp32 physics is added.
    use_amp: false
    physics_float32: true
    batch_mode: "cell_balanced"
    # Balance every active loss component against the DATA gradient via an EMA
    # of component gradient norms. Multipliers are clipped to the interval below
    # and logged per epoch alongside the nominal and curriculum-scaled weights,
    # so the effective weight is reproducible from the epoch log.
    use_gradient_balance: true
    gradient_balance_ema: 0.95
    gradient_balance_min_multiplier: 0.1
    gradient_balance_max_multiplier: 10.0
    # Checkpoint eligibility: refuse to select a best checkpoint before the
    # curriculum factor reaches 1.0. Guards against reporting a partially
    # physics-active model as the full PINN.
    checkpoint_after_physics_active: true
    # Candidate cross-cell pairs drawn per batch for the pairwise loss.
    pairwise_max_pairs: 256
    # Two-phase outer-training refit: after inner train/val chooses best_epoch,
    # discard the temporary model and retrain a fresh one on ALL outer-training
    # cells for exactly best_epoch+1 epochs. Matches how the classical model
    # is trained on the full outer-training fold.
    two_phase_refit: true
    # PDE-gradient enforcement gate (physics-active epochs after warm-up).
    pde_gradient_min_norm: 1.0e-8
    pde_gradient_zero_patience: 5

  losses:
    # Conservative nominal weights. Gradient-norm balancing (above) removes the
    # raw scale mismatch between components, so these express intent rather than
    # magnitude. Any retuning must use INNER-validation only.
    data: 1.0
    # ODE residual: du/ds + r = 0. The governing equation is an ordinary (not
    # partial) differential equation in the stress coordinate s; "pde" is
    # accepted as a legacy alias by LossWeights.from_mapping.
    ode: 0.01
    # With the hard initial condition the IC residual is identically zero, so
    # this weight is inert by construction. It is kept at a small non-zero value
    # only so the logged residual keeps acting as a runtime assertion that the
    # residual parameterisation is in force.
    initial_condition: 0.1
    integral: 0.005
    monotonicity: 0.5
    bounds: 0.5
    rate_regularization: 1.0e-4
    # Direct Huber supervision of the rate head on the observed degradation
    # rate. Conservative starting weight; tune on inner validation only.
    rate_data: 0.05
    # Cross-cell relative-degradation regulariser. DISABLED by default: its
    # weight would have to be tuned on inner-validation folds of ~28 rows / 4-5
    # cells, which is too noisy to trust as a headline setting. Enable it only
    # as a reported ablation.
    pairwise: 0.0
    huber_delta: 1.0
    # Neural-residual share penalty (HybridRateModel only). Active only when
    # pinn.model.use_hybrid_rate is true. Penalises the neural residual for
    # carrying more than hybrid_residual_share_limit of the total rate.
    residual_share: 0.01

  bounds:
    u_min: 0.0
    u_max_source: "outer_training"   # constant | outer_training
    u_max_constant: 1.05
    u_max_margin: 0.05

  monotonicity:
    tolerance_source: "outer_training"   # constant | outer_training
    tolerance_constant: 0.02
    tolerance_quantile: 0.95

  curriculum:
    # With maximum_epochs=500: physics starts ramping at epoch 25 and is fully
    # active from epoch 100. Checkpoint eligibility and early-stopping patience
    # both begin at epoch 100, and minimum_epochs=180 guarantees at least 80
    # fully-physics-active epochs before a fold may stop.
    #
    # The two-phase refit derives its OWN schedule from the actual refit length
    # (best_epoch + 1) rather than reusing maximum_epochs, so a short refit still
    # reaches curriculum factor 1.0.
    warmup_fraction: 0.05
    ramp_end_fraction: 0.20

  evaluation:
    bootstrap_replicates_development: 100
    bootstrap_replicates_final: 1000
    bootstrap_unit: "cell"
    bootstrap_random_state: 42

  logging:
    console: true
    epoch_csv: true
    epoch_parquet: true
    tensorboard: false
    log_every_epochs: 1
    save_checkpoint_every_epochs: 100
    log_gpu_memory: true
    log_gradient_norms: true
    log_physics_metrics: true

  ablation:
    # A0–A7 isolate existing NaPINN-Q components (ODE residual, integral
    # consistency, monotonicity, bounds, IC, rate supervision, pairwise).
    # A8–A13 isolate the new hybrid-rate components (parametric law, cold
    # regime, diagnostics, residual share). A8–A13 only make sense when
    # use_hybrid_rate: true is set at the model level; set them to false
    # and run A0–A7 first to establish the generic-rate baseline, then
    # set use_hybrid_rate: true and re-enable A8–A13.
    enabled: false  # set true to run; separate sweep from the main fold run
    configurations:
      # ---- A0–A7: generic NaPINN-Q ablations (ODE loss weight keys) ---------
      - name: "A0_Data_Only"
        architecture: "NaPINN-Q"
        weights: {data: 1.0, ode: 0.0, initial_condition: 0.0, integral: 0.0,
                  monotonicity: 0.0, bounds: 0.0, rate_regularization: 0.0}
      - name: "A1_No_ODE_Residual"
        architecture: "NaPINN-Q"
        weights: {data: 1.0, ode: 0.0, initial_condition: 0.1, integral: 0.005,
                  monotonicity: 0.5, bounds: 0.5, rate_regularization: 1.0e-4}
      - name: "A2_No_Integral"
        architecture: "NaPINN-Q"
        weights: {data: 1.0, ode: 0.01, initial_condition: 0.1, integral: 0.0,
                  monotonicity: 0.5, bounds: 0.5, rate_regularization: 1.0e-4}
      - name: "A3_No_Monotonicity"
        architecture: "NaPINN-Q"
        weights: {data: 1.0, ode: 0.01, initial_condition: 0.1, integral: 0.005,
                  monotonicity: 0.0, bounds: 0.5, rate_regularization: 1.0e-4}
      - name: "A4_No_Bounds"
        architecture: "NaPINN-Q"
        weights: {data: 1.0, ode: 0.01, initial_condition: 0.1, integral: 0.005,
                  monotonicity: 0.5, bounds: 0.0, rate_regularization: 1.0e-4}
      - name: "A5_Full_NaPINN_Q"
        architecture: "NaPINN-Q"
        weights: {data: 1.0, ode: 0.01, initial_condition: 0.1, integral: 0.005,
                  monotonicity: 0.5, bounds: 0.5, rate_regularization: 1.0e-4,
                  rate_data: 0.05, pairwise: 0.0}
      # Isolates the direct rate supervision contribution.
      - name: "A6_No_Rate_Supervision"
        architecture: "NaPINN-Q"
        weights: {data: 1.0, ode: 0.01, initial_condition: 0.1, integral: 0.005,
                  monotonicity: 0.5, bounds: 0.5, rate_regularization: 1.0e-4,
                  rate_data: 0.0, pairwise: 0.0}
      # Reports the cross-cell pairwise loss as an ablation rather than baking
      # an inner-validation-tuned weight into the headline model.
      - name: "A7_With_Pairwise"
        architecture: "NaPINN-Q"
        weights: {data: 1.0, ode: 0.01, initial_condition: 0.1, integral: 0.005,
                  monotonicity: 0.5, bounds: 0.5, rate_regularization: 1.0e-4,
                  rate_data: 0.05, pairwise: 0.02}
      # ---- A8–A13: hybrid-rate component ablations (require use_hybrid_rate) -
      # A8: replace HybridRateModel with generic RateNet (hard IC + all physics
      # losses active). This is the "no parametric law" baseline.
      - name: "A8_Generic_Rate_Baseline"
        architecture: "NaPINN-Q"
        model_overrides: {use_hybrid_rate: false}
        weights: {data: 1.0, ode: 0.01, initial_condition: 0.1, integral: 0.005,
                  monotonicity: 0.5, bounds: 0.5, rate_regularization: 1.0e-4,
                  rate_data: 0.05, pairwise: 0.0, residual_share: 0.0}
      # A9: hybrid model, cold-regime term disabled. Isolates the low-temperature
      # gating contribution. Most cells are at 25 °C or 50 °C; this ablation is
      # only meaningfully different for the two -10 °C cells.
      - name: "A9_No_Cold_Regime"
        architecture: "NaPINN-Q"
        model_overrides: {use_hybrid_rate: true, hybrid_enable_cold_regime: false}
        weights: {data: 1.0, ode: 0.01, initial_condition: 0.1, integral: 0.005,
                  monotonicity: 0.5, bounds: 0.5, rate_regularization: 1.0e-4,
                  rate_data: 0.05, pairwise: 0.0, residual_share: 0.01}
      # A10: hybrid model, no residual-share penalty. Lets the neural residual
      # grow without constraint, turning the model back toward a black box.
      - name: "A10_No_Residual_Share_Penalty"
        architecture: "NaPINN-Q"
        model_overrides: {use_hybrid_rate: true}
        weights: {data: 1.0, ode: 0.01, initial_condition: 0.1, integral: 0.005,
                  monotonicity: 0.5, bounds: 0.5, rate_regularization: 1.0e-4,
                  rate_data: 0.05, pairwise: 0.0, residual_share: 0.0}
      # A11: hybrid model, C-rate exponent fitted (not frozen at 0). Tests the
      # Klick et al. finding that C-rate has no significant effect; expected to
      # converge to near-zero alpha given the confounded test matrix.
      - name: "A11_Fit_C_Rate_Exponent"
        architecture: "NaPINN-Q"
        model_overrides: {use_hybrid_rate: true, hybrid_fit_c_rate_exponent: true}
        weights: {data: 1.0, ode: 0.01, initial_condition: 0.1, integral: 0.005,
                  monotonicity: 0.5, bounds: 0.5, rate_regularization: 1.0e-4,
                  rate_data: 0.05, pairwise: 0.0, residual_share: 0.01}
      # A12: full hybrid model, all components active. This is the headline
      # hybrid-NaPINN-Q configuration that the paper reports.
      - name: "A12_Full_Hybrid_NaPINN_Q"
        architecture: "NaPINN-Q"
        model_overrides: {use_hybrid_rate: true}
        weights: {data: 1.0, ode: 0.01, initial_condition: 0.1, integral: 0.005,
                  monotonicity: 0.5, bounds: 0.5, rate_regularization: 1.0e-4,
                  rate_data: 0.05, pairwise: 0.0, residual_share: 0.01}
      # A13: hard initial condition disabled (soft IC, penalised). Tests whether
      # the exact IC enforcement is necessary or whether a strong IC penalty
      # achieves the same result. Uses hybrid model for fair comparison.
      - name: "A13_Soft_Initial_Condition"
        architecture: "NaPINN-Q"
        model_overrides: {use_hybrid_rate: true, predict_delta_u: false}
        weights: {data: 1.0, ode: 0.01, initial_condition: 1.0, integral: 0.005,
                  monotonicity: 0.5, bounds: 0.5, rate_regularization: 1.0e-4,
                  rate_data: 0.05, pairwise: 0.0, residual_share: 0.01}

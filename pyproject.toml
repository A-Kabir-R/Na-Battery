[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "na-battery-standard-cycling"
version = "0.1.0"
description = "Leakage-safe sodium-ion battery Standard-cycling pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "joblib>=1.3",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "pyarrow>=13.0",
  "matplotlib>=3.7",
  "seaborn>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
